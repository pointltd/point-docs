---
on:
  # Pull request checks are off to save Actions minutes: run them locally.
  # pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the older run of that pull request. Runs on main get their own group, so no deploy
# is ever cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_DIR: infrastructure/terraform/gcp/prod
  IMAGE_REPO: point
  IMAGE_NAME: docs

jobs:
  # Fails closed unless the user's local gate (node scripts/gate.mjs) posted a pass for this tree (see README, "Release gate").
  gate-check:
    name: Release gate pass
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the gate pass
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          GATE_LOGIN: tu-bob
        run: node scripts/gate-check.mjs

  # The docs checks run on hosted runners: free on this public repo.
  check:
    name: Docs checks
    uses: ./.github/workflows/checks.yaml
    permissions:
      contents: read
    secrets: inherit

  # The jobs below (docs image build, terraform check) are switched off; the gate and the docs checks cover them.
  # check-image:
  #   name: Build image
  #   if: github.event_name == 'pull_request'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4

  #     - uses: docker/setup-buildx-action@v3

  #     - name: Build docs image (not pushed)
  #       uses: docker/build-push-action@v6
  #       with:
  #         context: .
  #         target: prod
  #         platforms: linux/amd64
  #         push: false
  #         cache-from: type=gha
  #         cache-to: type=gha,mode=max

  # check-terraform:
  #   name: Check infrastructure
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4

  #     - uses: hashicorp/setup-terraform@v3
  #       with:
  #         terraform_version: "1.17.2"

  #     - name: Terraform Format
  #       run: terraform fmt -check -recursive -no-color
  #       working-directory: ${{ env.TF_DIR }}

  #     - name: Terraform Init
  #       run: terraform init -backend=false -input=false -no-color
  #       working-directory: ${{ env.TF_DIR }}

  #     - name: Validate
  #       run: terraform validate -no-color
  #       working-directory: ${{ env.TF_DIR }}

  deploy:
    name: Deploy to prod
    # Push to main and the manual "Run workflow" button deploy; pull requests never do.
    needs: [gate-check, check]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push docs image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: prod
          platforms: linux/amd64
          push: true
          # Google Analytics 4, property "Partha", web stream docs.partha.co (a public id, not a secret).
          build-args: |
            NUXT_PUBLIC_GA_ID=G-9083MT253F
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.17.2"

      - name: Terraform Init
        run: terraform init -input=false -no-color -backend-config="bucket=${GCP_PROJECT_ID}-tfstate"
        working-directory: ${{ env.TF_DIR }}

      - name: Validate
        run: terraform validate -no-color
        working-directory: ${{ env.TF_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -no-color -var-file=prod.tfvars
        working-directory: ${{ env.TF_DIR }}
