---
name: Docs checks

# Switched off on pull requests to save Actions minutes: run the docs checks locally. Run by hand from the Actions tab when needed.
on:
  # pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Missing translations, broken links and images, incomplete front matter, and pages that fail to prerender.
  check-docs:
    name: Check docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The paths the app links to (see README, "Checks"). partha-js is private, so this needs a read-only token.
      - name: Download the app's docs links
        env:
          GH_TOKEN: ${{ secrets.PARTHA_JS_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PARTHA_JS_READ_TOKEN is not set, so the app's docs links are not checked"
            exit 0
          fi
          gh api repos/pointltd/partha-js/contents/src/layers/base/app/docs-links.json \
            -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/app-links.json"

      - name: Check docs
        run: |
          if [ -f "$RUNNER_TEMP/app-links.json" ]; then
            pnpm check --build --app-links "$RUNNER_TEMP/app-links.json"
          else
            pnpm check --build
          fi
