server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Redirects stay relative: behind Cloud Run the visitor never sees this port.
    absolute_redirect off;

    # /en/ and /en are the same page.
    rewrite ^/(.+)/$ /$1 permanent;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The root has no page of its own: send visitors to the default language.
    location = / {
        return 302 /en;
    }

    # Hashed build files never change, so browsers may keep them for a year.
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # /en/getting-started/introduction is served from introduction.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
